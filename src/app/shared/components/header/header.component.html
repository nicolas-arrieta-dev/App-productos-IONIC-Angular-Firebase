<ion-header>
  <ion-toolbar color="primary">
    @if(backButton){
    <!-- ============ Back Button ============-->
    <ion-buttons slot="start">
      <ion-back-button [defaultHref]="backButton"></ion-back-button>
    </ion-buttons>
    }
    @if(isModal){
    <!-- ============ Dismiss Button ============-->

    <ion-button (click)="dismissModal()">
      <ion-icon name="close-circle-outline"></ion-icon>
    </ion-button>
    }
  @if(showMenu){
        <ion-buttons slot="start">
      <ion-menu-button menu="menu-content"></ion-menu-button>
    </ion-buttons>
  }

    <ion-title>
      <strong>{{title}}</strong>
      <div class="admin">A D M I N</div>
    </ion-title>
  </ion-toolbar>
</ion-header>
