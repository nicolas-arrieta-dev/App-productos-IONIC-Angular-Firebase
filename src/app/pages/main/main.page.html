<ion-menu contentId="menu-content" menuId="menu-content" side="start" type="overlay">
  <app-header title="Menu"></app-header>
  <ion-content class="ion-text-center">
    

    @if(user()?.image){
    <img class="image-profil" [src]="user()?.image">
     }
    @if(!user()?.image){
    <ion-icon class="empty-icon" name="person-circle-outline"></ion-icon>

    }

    <h4>
      {{user()?.name}}
    </h4>
    @for( p of pages; track $index){
    <ion-menu-toggle auto-hide="false">
      <ion-item [ngClass]="{'active': currentPath === p.url}" [routerLink]="p.url" routerDirection="root" detail>
        <ion-label>
          <ion-icon slot="start" [name]="p.icon"></ion-icon>
          {{p.title}}
        </ion-label>
      </ion-item>
    </ion-menu-toggle>
  }
  </ion-content>

<ion-footer class="ion-no-border safe-p-bottom">

    <ion-menu-toggle auto-hide="false">
      <ion-item lines="none" (click)="signOut()">
        <ion-label>
          <ion-icon slot="start" name="log-out-outline"></ion-icon>
         Cerrar Sesion
        </ion-label>
      </ion-item>
    </ion-menu-toggle>
  
</ion-footer>

</ion-menu>

<ion-router-outlet id="menu-content" main>

</ion-router-outlet>
