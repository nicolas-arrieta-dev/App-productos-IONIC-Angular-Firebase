<app-header backButton="/auth" title="Recuperar Cuenta"></app-header>

<ion-content>

  <div class="d-flex-center">
    <form [formGroup]="form" class="auth-form" (ngSubmit)="submit()" (keypress.enter)="submit()">
      <app-logo></app-logo>

      <p class="ion-text-center"> Te emviaremos un email para que pueda restablecer tu contraseña</p>
      <!-- =================0 email 0================-->
      <app-custom-input autocomplete="email" icon="mail-outline" [control]="form.controls.email" type="email"
        label="correo"></app-custom-input>
      @if (form.controls.email.errors && form.controls.email.touched){
      <div class="validators">
        @if(form.controls.email.errors?.['required']){
        <div>El correo es requerido</div>
        }
        @if(form.controls.email.errors?.['email']){
        <div>Ingrese un correo valido</div>
        }
      </div>
      }


      <ion-button expand="block" mode="ios" class="submit" type="submit" [disabled]="form.invalid">
        Recuperar
        <ion-icon slot="end" name="arrow-forward"> </ion-icon>
      </ion-button>

    </form>
  </div>


</ion-content>
